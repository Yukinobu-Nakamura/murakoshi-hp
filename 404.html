<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>ページが見つかりません｜村越じゅんた 公式サイト</title>
<link rel="icon" href="/assets/img/favicon-64.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@700&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:#faf8f4; color:#272220;
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
    line-height:1.9; padding:32px 24px;
  }
  .box{ max-width:560px; width:100%; text-align:center; }
  .code{
    font-family:"Zen Old Mincho",serif; font-weight:700;
    font-size:clamp(56px,14vw,96px); line-height:1; color:#5b48b5;
    letter-spacing:.04em; margin:0 0 20px;
  }
  h1{
    font-family:"Zen Old Mincho",serif; font-weight:700;
    font-size:clamp(20px,4.6vw,26px); margin:0 0 18px; letter-spacing:.02em;
  }
  p{ color:#4e4741; font-size:15px; margin:0 0 32px; }
  a.btn{
    display:inline-block; background:#5b48b5; color:#fffdfa;
    text-decoration:none; border-radius:999px;
    padding:13px 36px; font-size:15px; font-weight:700; letter-spacing:.04em;
    transition:opacity .2s;
  }
  a.btn:hover{ opacity:.86; }
  a.btn:focus-visible{ outline:3px solid #272220; outline-offset:3px; }
  .name{
    margin-top:44px; padding-top:22px; border-top:1px solid rgba(39,34,32,.14);
    font-family:"Zen Old Mincho",serif; font-weight:700; font-size:15px; letter-spacing:.1em;
  }
  .name span{
    display:block; font-family:"Zen Kaku Gothic New",sans-serif; font-weight:400;
    font-size:10px; letter-spacing:.2em; color:#6f6862; margin-top:5px;
  }
</style>
</head>
<body>
  <main class="box">
    <p class="code">404</p>
    <h1>ページが見つかりませんでした</h1>
    <p>お探しのページは、移動または削除された可能性があります。<br>お手数ですが、トップページからお探しください。</p>
    <a class="btn" href="/">トップページへ戻る</a>
    <p class="name">村越じゅんた<span>MURAKOSHI JUNTA</span></p>
  </main>
</body>
</html>
