name: 本番デプロイ（さくら）

# master ブランチに変更が入ると、さくらのレンタルサーバへ自動アップロードする。
# Secrets（SAKURA_FTP_HOST / SAKURA_FTP_USER / SAKURA_FTP_PASS）が
# 未設定のうちは何もせずスキップするので、放置してもエラーにはならない。
#
# 設定手順: docs/SETUP_GUIDE_C1.html の STEP 10 / STEP 11 を参照。

on:
  push:
    branches: [master]
  workflow_dispatch:        # Actions タブから手動実行も可

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # ★ さくらの「Web公開フォルダ」のフルパス（末尾の / まで必要）
  #    コントロールパネルの ドメイン/SSL 一覧で確認できる値に合わせること。
  #    現在の設定: ~/www/seiji  →  /home/junta-murakoshi/www/seiji/
  SERVER_DIR: /home/junta-murakoshi/www/seiji/
  # ★ 公開後の自動チェックに使う本番URL
  SITE_URL: https://junta-murakoshi.jp/

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production   # Settings > Environments で承認者を設定すると、本番反映前に承認が必要になる
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Secrets の設定有無を確認
        id: cfg
        env:
          H: ${{ secrets.SAKURA_FTP_HOST }}
          U: ${{ secrets.SAKURA_FTP_USER }}
          P: ${{ secrets.SAKURA_FTP_PASS }}
        run: |
          if [ -n "$H" ] && [ -n "$U" ] && [ -n "$P" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SAKURA_FTP_HOST / USER / PASS が未設定のためスキップしました（docs/SETUP_GUIDE_C1.html の STEP 10 を参照）"
          fi

      - name: 本番用に検索除け（noindex）を解除
        if: steps.cfg.outputs.ready == 'true'
        run: |
          # リポジトリ上は常に noindex を付けておき（＝ステージングは検索に出ない）、
          # 本番へ上げるこの瞬間にだけ外す。これで本番とステージングの二重掲載を防ぐ。
          sed -i '/<meta name="robots" content="noindex, nofollow">/d' index.html
          if grep -qi 'noindex' index.html; then
            echo "::error::index.html に noindex が残っています。デプロイを中止しました。"
            exit 1
          fi
          echo "index.html の noindex を解除しました"

      - name: さくらへ FTPS でアップロード
        if: steps.cfg.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          # ★ ホスト名は必ず初期ドメイン（xxxxx.sakura.ne.jp）。
          #    独自ドメインを指定すると TLS 証明書エラーで必ず失敗する。
          server:   ${{ secrets.SAKURA_FTP_HOST }}
          username: ${{ secrets.SAKURA_FTP_USER }}
          password: ${{ secrets.SAKURA_FTP_PASS }}
          protocol: ftps          # さくらは「明示的な TLS」／ポート21
          port: 21
          server-dir: /home/junta-murakoshi/www/seiji/
          local-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/_sources/**
            **/docs/**
            **/patterns/**
            **/tools/**
            **/thoughts/**
            **/*.md
            **/showcase.html
            **/node_modules/**

      - name: 公開後の自動チェック
        if: steps.cfg.outputs.ready == 'true'
        continue-on-error: true   # ここで失敗してもデプロイ自体は成功扱いにする
        run: |
          sleep 10
          code=$(curl -sS -o /tmp/body.html -w "%{http_code}" --max-time 25 -L "$SITE_URL" || echo "000")
          echo "HTTPステータス: $code"
          if [ "$code" != "200" ]; then
            echo "::warning::本番URLが 200 を返していません（SSL未発行・DNS・.htaccess の順に確認してください）"
          fi
          if grep -qi 'noindex' /tmp/body.html 2>/dev/null; then
            echo "::warning::本番ページに noindex が残っています"
          fi
          if grep -q '村越じゅんた' /tmp/body.html 2>/dev/null; then
            echo "本文の確認: OK"
          else
            echo "::warning::本文が想定と異なります（アップロード先フォルダが違う可能性）"
          fi
