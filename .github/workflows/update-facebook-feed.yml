name: Facebook最新投稿の取り込み

# ACTIVITY セクション用に、Facebookページの最新投稿3件を取得して
# assets/data/facebook-latest.json と assets/img/fb/ を更新する。
# Secrets(FB_PAGE_ID / FB_ACCESS_TOKEN)が未設定のうちは何もせずスキップする。

on:
  schedule:
    - cron: '0 21 * * *'   # 毎日 06:00 JST (UTC 21:00)
  workflow_dispatch:        # 手動実行も可

permissions:
  contents: write

concurrency:
  group: update-facebook-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Secrets の設定有無を確認
        id: cfg
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: |
          if [ -n "$FB_PAGE_ID" ] && [ -n "$FB_ACCESS_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FB_PAGE_ID / FB_ACCESS_TOKEN が未設定のためスキップしました(READMEの手順を参照)"
          fi

      - name: Python を用意
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 最新投稿を取得して JSON を更新
        if: steps.cfg.outputs.ready == 'true'
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: python3 tools/update_facebook_feed.py

      - name: 変更があればコミットして push
        if: steps.cfg.outputs.ready == 'true'
        run: |
          if [ -z "$(git status --porcelain assets/data/facebook-latest.json assets/img/fb)" ]; then
            echo "変更なし。コミットしません。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/facebook-latest.json assets/img/fb
          git commit -m "chore: ACTIVITYのFacebook最新投稿を更新"
          git push
